<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0E131A" />
      <stop offset="100%" stop-color="#080B0F" />
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#27D3E2" />
      <stop offset="100%" stop-color="#0FA6B5" />
    </linearGradient>
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34D399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Container Box -->
  <rect x="4" y="4" width="112" height="112" rx="24" fill="url(#bgGrad)" stroke="#1F2937" stroke-width="2" />

  <!-- Subtle Atmospheric Radar Concentric Rings -->
  <circle cx="60" cy="60" r="42" fill="none" stroke="#27D3E2" stroke-opacity="0.12" stroke-width="1.5" stroke-dasharray="3 3" />
  <circle cx="60" cy="60" r="28" fill="none" stroke="#27D3E2" stroke-opacity="0.18" stroke-width="1" />

  <!-- Atmospheric Flow Streamlines / Waves (Prana / Vayu) -->
  <path d="M 28 68 C 40 68, 44 44, 60 44 C 76 44, 80 68, 92 68" fill="none" stroke="url(#cyanGrad)" stroke-width="4.5" stroke-linecap="round" filter="url(#glow)" />
  <path d="M 34 78 C 44 78, 48 58, 60 58 C 72 58, 76 78, 86 78" fill="none" stroke="url(#emeraldGrad)" stroke-width="3" stroke-linecap="round" stroke-opacity="0.75" />

  <!-- Center Particle / Monitor Station Node -->
  <circle cx="60" cy="44" r="5" fill="#27D3E2" filter="url(#glow)" />
  <circle cx="60" cy="44" r="2" fill="#FFFFFF" />

  <!-- Secondary Wind Vector Arrowhead -->
  <path d="M 88 64 L 95 68 L 88 72" fill="none" stroke="#27D3E2" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
</svg>
